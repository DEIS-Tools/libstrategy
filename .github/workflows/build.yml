---
name: Build and Test
on:
  push:
    branches: [master]
    paths:
      - src/**
      - test/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
  pull_request:
    branches: [master]
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - src/**
      - test/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
  workflow_dispatch:

concurrency:
  group: Server-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ubuntu-2404:
    runs-on: ubuntu-24.04
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Setup Runner Environment
        run: |
          uname -a
          lsb_release -a
          CORES=$(nproc)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_LOAD=$CORES" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Install Build Tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install cmake ninja-build g++ libboost-program-options-dev libboost-test-dev
      - name: Configure Multi-Config
        run: cmake --preset multi-san
      - name: Build Debug
        run: cmake --build --preset debug-san
      - name: Test Debug
        run: ctest --preset debug-san
      - name: Build Release
        run: cmake --build --preset release-san
      - name: Test Release
        run: ctest --preset release-san

  macOS-13:
    runs-on: macos-13
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '14.3.1'
      - name: Setup Runner Environment
        run: |
          uname -a
          xcrun --show-sdk-version
          CORES=$(sysctl -n hw.ncpu)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_LOAD=$CORES" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake ninja boost
      - name: Configure Multi-Config
        run: cmake --preset multi-san
      - name: Build Debug
        run: cmake --build --preset debug-san
      - name: Test Debug
        run: ctest --preset debug-san
      - name: Build Release
        run: cmake --build --preset release-san
      - name: Test Release
        run: ctest --preset release-san

  macOS-14:
    runs-on: macos-14
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4.0'
      - name: Setup Runner Environment
        run: |
          uname -a
          xcrun --show-sdk-version
          CORES=$(sysctl -n hw.ncpu)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_LOAD=$CORES" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake ninja boost
      - name: Configure Multi-Config
        run: cmake --preset multi-san
      - name: Build Debug
        run: cmake --build --preset debug-san
      - name: Test Debug
        run: ctest --preset debug-san
      - name: Build Release
        run: cmake --build --preset release-san
      - name: Test Release
        run: ctest --preset release-san

  macOS-15:
    runs-on: macos-15
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'
      - name: Setup Runner Environment
        run: |
          uname -a
          xcrun --show-sdk-version
          CORES=$(sysctl -n hw.ncpu)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_LOAD=$CORES" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew update
          brew install cmake ninja boost
      - name: Configure Multi-Config
        run: cmake --preset multi-san
      - name: Build Debug
        run: cmake --build --preset debug-san
      - name: Test Debug
        run: ctest --preset debug-san
      - name: Build Release
        run: cmake --build --preset release-san
      - name: Test Release
        run: ctest --preset release-san
